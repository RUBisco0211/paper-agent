# Paper Agent 单机开发/部署依赖。
# 使用 `docker compose up -d postgres redis` 启动数据库与邮件验证临时状态；pgvector 扩展由 Alembic 迁移创建。
#
# 容器名由 compose project 前缀决定（默认取目录名），不写死：
#   主仓库          → paper-agent-postgres-1
#   某个 worktree   → <worktree 目录名>-postgres-1
# 写死名字会让第二个 checkout 因重名启动失败，或者更糟：两边悄悄连同一个库。
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: paper_agent
      POSTGRES_DB: paper_agent
      # 真实值放在仓库根 .env（不入库）；compose 只给开发用默认值
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paper_agent_dev}

    ports:
      # 只绑本机：Postgres 不应在局域网可见。
      # 主机端口可覆盖：多个 checkout 并存时各用各的端口，避免连到别人的库。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_agent -d paper_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 仅保存验证码、一次性凭证与冷却/限流；持久邮件 outbox 在 PostgreSQL。
  # 允许丢失最近几十秒的写入（用户重新收一次验证码），因此不做 AOF；
  # 不作为 Celery 或邮件任务队列。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 验证码与限流计数重启后应当还在：60 秒内至少 1000 次写入就存一次快照。
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 对象存储（RustFS，S3 兼容，Apache-2.0）。默认**不随 `docker compose up -d` 启动**：
  #   docker compose --profile storage up -d storage
  # 后端改用它的方式（backend/.env）：
  #   STORAGE_BACKEND=s3
  #   S3_ENDPOINT_URL=http://127.0.0.1:9000
  #   S3_ACCESS_KEY=... / S3_SECRET_KEY=... / S3_BUCKET=paper-agent
  # 提醒：RustFS 官方标注「rapid development，请勿用于生产环境」。它只供开发验证；
  # 生产配置受信任的 S3 兼容服务或云对象存储，并设置 STORAGE_BACKEND=s3。
  storage:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    profiles: ["storage"]
    restart: unless-stopped
    # 数据目录由位置参数给出；容器以 uid 10001 运行（命名卷无需手工 chown）
    command: ["/data"]
    environment:
      # 官方明确要求不要使用默认的 rustfsadmin
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-paper-agent}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-paper_agent_dev_storage}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-warn}
    ports:
      # 只绑本机：对象存储自身鉴权较弱，服务器上让后端走内网访问
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"   # S3 API
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"   # 控制台
    volumes:
      - storage-data:/data
    healthcheck:
      # 镜像内没有 curl/wget，用镜像自带的 rustfs 二进制做 liveness 探测
      test: ["CMD", "rustfs", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  storage-data:
