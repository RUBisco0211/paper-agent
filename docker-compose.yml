# Paper Agent 单机开发/部署依赖。
# 使用 `docker compose up -d postgres` 启动数据库；pgvector 扩展由 Alembic 迁移创建。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: paper-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paper_agent
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: paper_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_agent -d paper_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
