# Paper Agent 单机开发/部署依赖。
# 使用 `docker compose up -d postgres redis` 启动数据库与邮件验证临时状态；pgvector 扩展由 Alembic 迁移创建。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: paper-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paper_agent
      POSTGRES_DB: paper_agent
      # 真实值放在仓库根 .env（不入库）；compose 只给开发用默认值
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paper_agent_dev}

    ports:
      # 只绑本机：Postgres 不应在局域网可见
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_agent -d paper_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 仅保存验证码、一次性凭证与冷却/限流；持久邮件 outbox 在 PostgreSQL。
  # 不持久化：状态丢失后须重新验证；不作为 Celery 或邮件任务队列。
  redis:
    image: redis:7-alpine
    container_name: paper-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # 容器内与宿主机都使用标准 6379；本机不得再运行第二个 Redis。
      # 服务器上的应用容器直接通过服务名 redis:6379 访问。
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Embedding 服务（text-embeddings-inference + BAAI/bge-m3，1024 维）
  # 默认镜像适用于 Apple Silicon 的 Docker（纯 CPU）；服务器按硬件替换 TEI_IMAGE：
  #   NVIDIA Ampere 8.0（A100/A30） ghcr.io/huggingface/text-embeddings-inference:1.9
  #   NVIDIA Ampere 8.6（A10/A40） ghcr.io/huggingface/text-embeddings-inference:86-1.9
  #   NVIDIA Ada（RTX 4000）       ghcr.io/huggingface/text-embeddings-inference:89-1.9
  #   NVIDIA Hopper（H100）        ghcr.io/huggingface/text-embeddings-inference:hopper-1.9
  #   x86_64 纯 CPU                ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
  #   Apple Silicon（Docker/CPU）  ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9
  # 自建向量服务。默认**不随 `docker compose up -d` 启动**，需要显式启用：
  #   本地/服务器：docker compose --profile embeddings up -d embedding
  # 原因：bge-m3 是 fp32 的 2.3GB 权重，加载后常驻约 2.5~3GB；内存吃紧的机器
  # （笔记本）会被拖进换页。本地开发建议用云 Embedding（见 backend/.env.example），
  # 自建留给内存充足的服务器。
  embedding:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9}
    container_name: paper-agent-embedding
    profiles: ["embeddings"]
    restart: unless-stopped
    environment:
      # 拉取权重的 HF 端点。默认官方站点；网络无法直连 HF 时在仓库根 .env 里设
      # HF_ENDPOINT=https://hf-mirror.com（容器不会自动继承宿主机代理）
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    command:
      - --model-id
      # 默认按模型名由容器内下载；网络受限时可预下载到 ./models 并把该值设成 /models/bge-m3
      - ${EMBEDDING_MODEL:-BAAI/bge-m3}
      - --port
      - "80"
      # 与后端每批 32 条一致；bge-m3 上下文 8192，超长自动截断
      - --max-client-batch-size
      - "32"
      - --auto-truncate
    ports:
      # 只绑本机：TEI 自身没有鉴权，服务器上不要对外暴露；后端与它同机或走内网
      - "127.0.0.1:8080:80"
    volumes:
      # 模型权重缓存在卷里，重启不重复下载
      - embedding-data:/data
      # 也可把预下载好的权重放在 ./models 下（只读挂载）
      - ./models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # 对象存储（RustFS，S3 兼容，Apache-2.0）。默认**不随 `docker compose up -d` 启动**：
  #   docker compose --profile storage up -d storage
  # 后端改用它的方式（backend/.env）：
  #   STORAGE_BACKEND=s3
  #   S3_ENDPOINT_URL=http://127.0.0.1:9000
  #   S3_ACCESS_KEY=... / S3_SECRET_KEY=... / S3_BUCKET=paper-agent
  # 提醒：RustFS 官方标注「rapid development，请勿用于生产环境」。它只供开发验证；
  # 生产配置受信任的 S3 兼容服务或云对象存储，并设置 STORAGE_BACKEND=s3。
  storage:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: paper-agent-storage
    profiles: ["storage"]
    restart: unless-stopped
    # 数据目录由位置参数给出；容器以 uid 10001 运行（命名卷无需手工 chown）
    command: ["/data"]
    environment:
      # 官方明确要求不要使用默认的 rustfsadmin
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-paper-agent}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-paper_agent_dev_storage}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-warn}
    ports:
      # 只绑本机：对象存储自身鉴权较弱，服务器上让后端走内网访问
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # 控制台（用上面的 Access/Secret 登录）
    volumes:
      - storage-data:/data
    healthcheck:
      # 镜像内没有 curl/wget，用镜像自带的 rustfs 二进制做 liveness 探测
      test: ["CMD", "rustfs", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  embedding-data:
  storage-data:
