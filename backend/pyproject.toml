[project]
name = "paper-agent"
version = "0.1.0"
description = "FastAPI backend for Paper Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agentscope>=2.0.6",
    "alembic>=1.19.1",
    "argon2-cffi>=23.1.0",
    "asgi-correlation-id>=5.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "pyjwt>=2.10.1",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0,<2.1",
    "structlog>=26.1.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF001: error messages are Chinese and intentionally use full-width punctuation.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
