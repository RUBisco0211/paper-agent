[project]
name = "paper-agent"
version = "0.1.0"
description = "FastAPI backend for Paper Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agentscope>=2.0.6",
    "alembic>=1.19.1",
    "asgi-correlation-id>=5.0.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0,<2.1",
    "structlog>=26.1.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
