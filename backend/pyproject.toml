[project]
name = "paper-agent"
version = "0.1.0"
description = "FastAPI backend for Paper Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agentscope[service,storage-sql]==2.0.11",
    "alembic>=1.19.1",
    "argon2-cffi>=23.1.0",
    "asgi-correlation-id>=5.0.1",
    "cryptography>=50,<51",
    "fastapi>=0.141.1",
    "fonttools>=4.60.0",
    "httpx>=0.28",
    "pyjwt>=2.10.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4.0",
    "pypdf>=6.0.0",
    "python-multipart>=0.0.20",
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0,<2.1",
    "structlog>=26.1.0",
    "uvicorn>=0.30.0",
    "boto3>=1.35",
    "redis>=5,<7",
    "markdown-it-py>=4,<5",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF001: error messages are Chinese and intentionally use full-width punctuation.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Agent 执行链路本身是异步的，测试直接用 async def
asyncio_mode = "auto"
